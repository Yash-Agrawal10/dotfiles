# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload tmux conf
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Pass through terminal focus events
set -g focus-events on

# Vim motions for navigating/resizing panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1
bind -r C-Left resize-pane -L 1
bind -r C-down resize-pane -D 1
bind -r C-Up resize-pane -U 1
bind -r C-Right resize-pane -R 1

# Copy mode uses vim keybindings
set -g mode-keys vi

# Esc delay reduction
set -g escape-time 10

# Window/pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Scrollback history
set -g history-limit 10000

# Status bar (Catppuccin Mocha)
set -g status-position bottom
set -g status-style "bg=#a6e3a1,fg=#cdd6f4"
set -g status-left-length 50
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S "
set -g status-right "#[bg=#6c7086,fg=#1e1e2e] %H:%M "
set -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=#45475a,fg=#cdd6f4"
set -g window-status-format " #I:#W "
set -g window-status-separator ""

# Open new panes/windows in the current pane's working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

